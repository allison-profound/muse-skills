connector: beehiiv
category: productivity
display_name: "beehiiv"
icon: beehiiv
description: "Manage your beehiiv newsletters, posts, subscribers and analytics"
cli:
  binary: beehiiv-connector-cli
  skill: beehiiv
auth:
  provider: beehiiv
  required: true
  mcp:
    endpoint: "https://mcp.beehiiv.com/mcp"
    oauth:
      type: "oauth"
      authorization_url: "https://mcp.beehiiv.com/authorize"
      token_url: "https://mcp.beehiiv.com/token"
      registration_url: "https://mcp.beehiiv.com/register"
      scope: "read write"
      resource: "https://mcp.beehiiv.com/mcp"
      token_endpoint_auth_method: "none"
surrogation:
  name: beehiiv
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
    - mcp.beehiiv.com
  token_proxy:
    - field: credentials.access_token
      placement: bearer_header
  stripped:
    - credentials.refresh_token
  token_refresh:
    - path: /token
