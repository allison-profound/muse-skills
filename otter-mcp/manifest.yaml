version: 1
metadata:
  visible_in_settings: true
connector: otter
category: productivity
display_name: "Otter.ai"
icon: otter_ai
description: "Find and review your Otter.ai meeting conversations"
cli:
  binary: otter-connector-cli
  skill: otter
auth:
  provider: otter
  required: true
  mcp:
    endpoint: "https://mcp.otter.ai/mcp"
    oauth:
      type: "oauth"
      authorization_url: "https://otter.ai/oauth2/authorize"
      token_url: "https://otter.ai/oauth/token"
      registration_url: "https://otter.ai/oauth/register"
      revoke_url: "https://otter.ai/oauth/revoke_token"
      resource: "https://mcp.otter.ai/"
      token_endpoint_auth_method: "none"
    tool_names:
      get_user_info: otter_get_user_info
      search: otter_search
      fetch: otter_fetch
surrogation:
  name: otter
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
    - mcp.otter.ai
    - otter.ai
  token_proxy:
    - field: credentials.access_token
      placement: bearer_header
  stripped:
    - credentials.refresh_token
  token_refresh:
    - path: /oauth/token
actions:
  read:
    default: ask
    label: "Read permissions"
    response_guard: verification_codes
    methods:
      get_user_info:
        label: "Get user info"
      search:
        label: "Search"
      fetch:
        label: "Fetch"
consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Otter.ai"
      text: "Muse will access things like meeting transcripts, summaries, action items and attendees."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Otter.ai. To learn more, view their [terms](https://otter.ai/software-services-agreement) and [privacy policy](https://otter.ai/privacy-policy)."
