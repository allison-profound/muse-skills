id: expedia
title: "Expedia"
description: "Search Expedia hotels and other lodging, inspect room rates, book pay-now rates and recover uncertain bookings."
aliases: [expedia]
include_in_prompt: true
require_auth: false
non_confidential: true
features:
  expedia-payment-readiness:
    # validate-booking's payment_setup_required and book's Link setup resume
    # hint. The readiness read and its logging run whatever the gate says.
    gk: hatch_travel_payment_readiness
  expedia-link-at-approval:
    gk: hatch_travel_link_at_approval
    # Native checkout asks for Link only when `book` stops before the
    # approval, with why it's needed and the same rate on Expedia's site when
    # the user would rather not connect it; validate-booking then says nothing
    # about Link. The same gate as Duffel's feature.
  expedia-hotel-merge:
    gk: hatch_hotel_sources_merge_expedia
    # Within hotel-sources: whether Expedia's hotels join the other lodging
    # connectors' in one merged card list (`hotels merge`) instead of
    # showing as their own list. The runtime checks it when it builds a
    # merged list, and the skill's blocks of this name carry both wordings.
    # Off until blending Expedia with Duffel and Agoda is chosen.
  expedia-traveler-profiles:
    gk: hatch_traveler_profiles
    methods: [traveler.read]
    # Saved traveler details in a booking's guests, `travelers`, and
    # `traveler-request`, which asks for missing ones in a secure chat form.
    # The same gate as Duffel's traveler-profiles feature.
availability:
  scopes: [internal-test, external-connectors-test, alpha, prod, prod-cvm, quail, swarm, swarm-cvm, canary, canary-cvm-2, debug-cvm]
  gk: hatch_connector_exp_enable
  confidential_vm: true
auth:
  authorize: cli
