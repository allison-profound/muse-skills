version: 1
gating:
  allowed_countries: [US]
metadata:
  visible_in_settings: true
auth:
  client_id: "tpc_v7bQN48pzoADB4qAhEUQjG"
  provider: zocdoc
  required: false
connector: zocdoc
category: health
display_name: Zocdoc
icon: zocdoc
description: Search healthcare providers, check insurance eligibility, and book appointments on Zocdoc
request_quota:
  mode: shadow
  workers: [zocdoc]
  queries_per_minute: 50
  burst: 10
cli:
  binary: zocdoc
  skill: zocdoc
  service: zocdoc
declarable_scopes: []
surrogation:
  name: zocdoc
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
    - api-developer.zocdoc.com
  token_proxy:
    - field: credentials.access_token
      placement: bearer_header
  token_refresh:
    - path: /mcp/v2/token
actions:
  read:
    default: allow
    label: Search Zocdoc
    response_guard: verification_codes
    methods:
      catalog.read:
        label: Inspect reviewed Zocdoc capabilities
        approval_phrase: inspect reviewed Zocdoc capabilities
      providers.read:
        label: Search providers and care options
        approval_phrase: search providers and care options on Zocdoc
      appointments.read:
        label: Check appointment availability
        approval_phrase: check appointment availability on Zocdoc
      insurance.read:
        label: Search insurance plans and carriers
        approval_phrase: search insurance plans and carriers on Zocdoc
      insurance.eligibility.read:
        label: Check insurance coverage and deductible
        approval_phrase: check your insurance coverage and deductible on Zocdoc
      appointments.prepare:
        label: Prepare an appointment booking
        approval_phrase: prepare an appointment booking on Zocdoc
  write:
    default: ask
    label: Book appointments
    response_guard: verification_codes
    methods:
      appointments.book:
        label: Confirm an appointment booking
        approval_phrase: confirm this appointment booking on Zocdoc
        approval_policy: fresh_consent_only
commands:
  status: null
  authorize-url: null
  refresh: null
  disconnect: null
  list-tools: catalog.read
  # Each reviewed provider tool selects its own method at runtime.
  call-tool: null
consent_screen:
  bullets:
    - icon: data_types
      title: "Find care with Zocdoc"
      text: "Muse can find US healthcare providers, check insurance coverage and deductibles, and book appointments."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "Learn more about how we use this info in our [Privacy Policy](https://www.facebook.com/privacy/policy/) and [Health Policy](https://www.facebook.com/privacy/policies/health/)."
    - "Muse will exchange info with Zocdoc. To learn more, view their [terms](https://www.zocdoc.com/about/terms/) and [privacy policy](https://www.zocdoc.com/about/privacy/)."
