version: 1
metadata:
  visible_in_settings: true
connector: wix
category: productivity
display_name: Wix
icon: wix
description: Build, manage and publish your Wix sites and search the Wix developer docs
cli:
  binary: wix-connector-cli
  skill: wix
auth:
  provider: wix
  required: true
  mcp:
    endpoint: https://mcp.wix.com/mcp
    oauth:
      type: oauth
      authorization_url: https://mcp.wix.com/authorize
      token_url: https://mcp.wix.com/token
      registration_url: https://mcp.wix.com/register
      resource: https://mcp.wix.com/mcp
      token_endpoint_auth_method: none
      scope: offline_access
    tool_names:
      sites.read:
      - WixREADME
      - SearchWixWDSDocumentation
      - SearchWixRESTDocumentation
      - SearchWixSDKDocumentation
      - SearchBuildAppsDocumentation
      - SearchWixHeadlessDocumentation
      - ReadFullDocsArticle
      - ReadFullDocsMethodSchema
      - ListWixSites
      - GetSiteContext
      - SearchWixAPISpec
      - BrowseWixRESTDocsMenu
      - SearchWixHelpCenter
      - SearchDevelopmentDocumentation
      - SearchWixCLIDocumentation
      - SearchSiteTemplates
      - StartHeadlessBuild
      - StartStudioTwoSite
      - pullSiteCreationJob
      - CheckDomainAvailability
      - GetSuggestedDomains
      sites.modify:
      - ExecuteWixAPI
      - StartDeployWebsite
      - CallWixSiteAPI
      - ManageWixSite
      - CreateSiteFromTemplate
      - WixHarmonyEditorBuild
      - ClaimAnonymousSite
      - import-claude-design-from-url
      files.upload:
      - UploadHeadlessWebsiteFiles
      - UploadImageToWixSite
      feedback.send:
      - ReportIssueToWix
surrogation:
  name: wix
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
    - mcp.wix.com
  token_proxy:
    - field: credentials.access_token
      placement: bearer_header
  stripped:
    - credentials.refresh_token
  token_refresh:
    - path: /token
actions:
  read:
    default: ask
    label: Read permissions
    methods:
      sites.read:
        label: Read Wix sites, documentation, templates and domain suggestions
  write:
    default: ask
    label: Write permissions
    methods:
      sites.modify:
        label: Create, change and publish sites
        approval_policy: fresh_consent_only
      files.upload:
        label: Upload files and site code
        approval_phrase: upload files or site code to Wix
        approval_policy: fresh_consent_only
      feedback.send:
        label: Send feedback to Wix
        approval_policy: fresh_consent_only
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Wix
    text: Muse will access things like site content, products, orders, bookings and contacts, and can build new sites and upload files for you.
  - icon: info
    title: You choose what Muse can do
    text: Muse can read information for your tasks. It will ask each time before making changes or running
      other actions. Disconnect at any time in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Wix. To learn more, view their [terms](https://www.wix.com/about/terms-of-use) and [privacy policy](https://www.wix.com/about/privacy).
