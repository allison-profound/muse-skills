version: 1
metadata:
  visible_in_settings: true
connector: descript
category: productivity
display_name: Descript
icon: descript
description: Find and edit your Descript video and audio projects
cli:
  binary: descript-connector-cli
  skill: descript
auth:
  provider: descript
  required: true
  mcp:
    endpoint: https://api.descript.com/v2/mcp
    oauth:
      type: oauth
      authorization_url: https://web.descript.com/mcp
      token_url: https://api.stytch.com/v1/public/project-live-ecb24d2f-9e61-422b-b168-571539b9acc5/oauth2/token
      registration_url: https://api.stytch.com/v1/public/project-live-ecb24d2f-9e61-422b-b168-571539b9acc5/oauth2/register
      resource: https://api.descript.com/v2/mcp
      token_endpoint_auth_method: none
    tool_names:
      projects.read:
      - search_drive
      - list_projects
      - get_project
      - list_folders
      - get_drive_info
      - wait_for_job
      - list_jobs
      projects.modify:
      - import_media
      - import_drive_media
      - prompt_project_agent
      - publish_project
      - export_transcript
      - export_timeline
      - report_upload_status
      - cancel_job
surrogation:
  name: descript
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
  - api.descript.com
  - api.stytch.com
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  stripped:
  - credentials.refresh_token
  token_refresh:
  - path: /v1/public/project-live-ecb24d2f-9e61-422b-b168-571539b9acc5/oauth2/token
actions:
  read:
    default: ask
    label: Read permissions
    methods:
      projects.read:
        label: Read projects, media and job status
  write:
    default: ask
    label: Write permissions
    methods:
      projects.modify:
        label: Edit, publish and export projects
        approval_policy: fresh_consent_only
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Descript
    text: Muse will access things like projects, files and transcripts.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Descript. To learn more, view their [terms](https://www.descript.com/terms) and [privacy policy](https://www.descript.com/privacy).
