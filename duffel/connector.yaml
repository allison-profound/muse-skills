id: duffel
title: "Duffel"
description: "Search, book and cancel complete flight itineraries through Duffel, reserve and cancel pay-at-pickup rental cars, and recheck the fare of a booked trip."
aliases: [duffel]
include_in_prompt: true
features:
  duffel-rental-cars:
    gk: hatch_duffel_rental_cars
    description_phrase: "reserve and cancel pay-at-pickup rental cars,"
    # Reading and cancelling a reservation stay available when the gate closes.
    methods: [car.quote, car.book]
  duffel-bags:
    gk: hatch_duffel_bags
    # --bag on validate-booking and book is refused by the CLI's own check.
    methods: [flight.bags]
  gflights-first:
    gk: hatch_flight_search_gflights_first
    # `gflights-url` and `route` serve the browser-first flight search; the
    # Flight Booking skill's gflights-first blocks describe the flow.
    methods: [flight.route]
  duffel-stays-shadow:
    gk: hatch_duffel_stays_shadow
    # The runtime runs `stay-shadow` in the background beside shown Expedia
    # hotel results. It is left out of the CLI help and the connector docs.
    methods: [stay.read]
non_confidential: true
availability:
  confidential_vm: true
