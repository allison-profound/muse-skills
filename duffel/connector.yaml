id: duffel
title: "Duffel"
description: "Search, book and cancel complete flight itineraries through Duffel, reserve and cancel pay-at-pickup rental cars, and recheck the fare of a booked trip."
aliases: [duffel]
include_in_prompt: true
features:
  traveler-profiles:
    gk: hatch_traveler_profiles
    methods: [traveler.read]
    # Saved traveler details and `traveler-request`, which asks for missing ones in a secure
    # chat form. Duffel's docs describe the flow in their traveler-profiles blocks, and the
    # Flight Booking and Trip Transport skills switch their own ask-in-chat lines on it.
  duffel-stays:
    gk: hatch_duffel_stays
    # stay-search, stay-rates and stay-quote call stay.quote, as car.quote
    # covers searching cars as well as quoting them. `book --quote-id` checks
    # this feature in the worker, since `book` has no connector method.
    files: [references/stays.md]
    methods: [stay.quote]
  duffel-stays-shadow:
    gk: hatch_duffel_stays_shadow
    # The runtime runs `stay-shadow` in the background beside shown Expedia
    # hotel results. It is left out of the CLI help and the connector docs.
    methods: [stay.read]
  duffel-card-retry:
    gk: hatch_duffel_card_retry
    # After Duffel declines the card, Link issues no card, or Duffel refuses
    # Link's payment token, `book` with another `--payment-method-id` (or,
    # for the token, the same command) opens a fresh checkout and approval
    # for the same offer instead of replaying the failure. Checked in the
    # worker, since `book` has no connector method; the recovery text in
    # references/recovery.md switches on it.
  duffel-payment-readiness:
    # validate-booking's and stay-quote's payment_setup_required and book's
    # Link setup resume hint. The readiness read and its logging run whatever
    # the gate says.
    gk: hatch_travel_payment_readiness
non_confidential: true
availability:
  confidential_vm: true
