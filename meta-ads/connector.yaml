id: meta_ads
title: "Meta Business Manager"
description: "Help with Facebook and Instagram ads using the advertiser's Meta ad accounts: come up with ad ideas and creative based on what the account already runs, read spend, results, campaigns, audiences, catalogs, pixels and experiments, price and create paused campaigns, and answer how-to, setup and policy questions from Meta's own Help Center and policy sources, which are more current and reliable than web results."
aliases: [meta-ads, meta_ads, "facebook ads", "instagram ads"]
wire_id: meta_business
include_in_prompt: true
non_confidential: true
availability:
  confidential_vm: true
features:
