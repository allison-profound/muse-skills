version: 1
metadata:
  visible_in_settings: true
connector: trustandwill
category: productivity
display_name: Trust & Will
icon: trustandwill
description: Check your connection and estate plan status in Trust & Will
cli:
  binary: trustandwill-connector-cli
  skill: trustandwill
auth:
  provider: trustandwill
  required: true
  mcp:
    endpoint: https://estate.mcp.trustandwill.com/mcp
    oauth:
      type: oauth
      authorization_url: https://connect.trustandwill.com/oauth2/authorize
      token_url: https://connect.trustandwill.com/oauth2/token
      registration_url: https://connect.trustandwill.com/oauth2/register
      resource: https://estate.mcp.trustandwill.com/mcp
      token_endpoint_auth_method: none
      scope: email offline_access openid profile
    tool_names:
      status.read:
      - get_connection_status
      - get_plan_status
surrogation:
  name: trustandwill
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
  - connect.trustandwill.com
  - estate.mcp.trustandwill.com
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  stripped:
  - credentials.refresh_token
  token_refresh:
  - path: /oauth2/token
actions:
  read:
    default: ask
    label: Read permissions
    methods:
      status.read:
        label: Check connection and estate-plan status
consent_screen:
  bullets:
  - icon: data_types
    title: Connect to Trust & Will
    text: Check your connection and estate plan status in Trust & Will.
  - icon: info
    title: You choose what Muse can do
    text: Muse can check your connection and estate plan status. This connection does not support plan
      changes, checkout or document generation. Disconnect at any time in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Trust & Will. To learn more, view their [terms](https://trustandwill.com:443/security/terms) and [privacy policy](https://trustandwill.com:443/security/privacy-policy).
